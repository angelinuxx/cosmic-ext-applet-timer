[package]
name = "cosmic-ext-applet-timer"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "A countdown timer applet for the COSMIC desktop"

[dependencies]
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["process", "time"] }

[dev-dependencies]
# Same format cosmic-config uses on disk.
ron = "0.12"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "95236a944bfd51c63a2fc65fe50a592c47168d40"
default-features = false
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
]

[profile.release]
opt-level = 3
lto = "thin"
